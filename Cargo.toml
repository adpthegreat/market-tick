[workspace]
resolver = "2"
members = [
    "crates/market-tick-abi",
    "programs/market-tick",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/adpthegreat/market-tick"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("no-entrypoint"))',
    'cfg(target_arch, values("sbf"))',
]

[workspace.dependencies]
market-tick-abi = { path = "crates/market-tick-abi" }
pinocchio = "=0.9.2"
pinocchio-pubkey = "=0.3.0"

litesvm = "=0.18.1"
solana-account = "4.3"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-instruction = "3.5"
solana-instruction-error = "2.5"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1.5"
solana-transaction-error = "3.4"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
